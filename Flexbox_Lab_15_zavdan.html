<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flexbox: інтерактивний урок</title>
<style>
:root{--bg:#0d1221;--panel:#171e31;--panel2:#202a43;--line:#36425c;--text:#f7f8fd;--muted:#b6c3d8;--violet:#a58aff;--mint:#75e4c1;--gold:#ffc976;--blue:#79bffc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 95% 0%,#252153 0,transparent 37%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}.shell{max-width:1180px;margin:auto;padding:24px 28px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{text-decoration:none;font-weight:850;letter-spacing:.03em;font-size:16px;color:var(--violet)}.topright{display:flex;align-items:center;gap:12px}.pill{border:1px solid #4c5981;border-radius:999px;padding:7px 13px;font-size:13px;color:#d9dff5}.reset{background:transparent;border:1px solid #4c5981;color:#e4e9ff;border-radius:10px;padding:9px 12px}.progress{height:7px;border-radius:50px;background:#2c354d;margin:20px 0 26px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#8a72fb,#70eac8);transition:width .3s}.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}.stage{color:#d9ccff;background:#4f3d82;padding:7px 11px;border-radius:7px;font-weight:700;font-size:12px;letter-spacing:.04em}.minutes{color:var(--muted);font-size:14px}h1{font-size:clamp(29px,4vw,52px);letter-spacing:-.03em;line-height:1.12;margin:12px 0 12px}p.lead{font-size:clamp(17px,2vw,22px);line-height:1.5;color:#d6dff1;max-width:1000px;margin:0 0 24px}.content{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:stretch}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;min-height:270px}.card h2{font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:#bfcbe1;margin:0 0 16px}.notebook{font-size:20px;line-height:1.55;margin:0;padding-left:24px}.notebook li{padding-left:4px;margin-bottom:12px}.notebook li::marker{color:var(--violet);font-weight:800}.hint{background:#252b46;border-left:4px solid var(--violet);padding:13px 16px;color:#e0dcfa;border-radius:5px;line-height:1.5;margin-top:14px}.screen{background:#0e172a;border:2px dashed #51617f;min-height:205px;border-radius:14px;padding:18px;position:relative;display:flex;gap:10px}.square{display:grid;place-items:center;color:white;font-weight:800;border-radius:9px;background:#8c70ee;width:60px;height:58px;flex:none;font-size:20px}.square:nth-child(2){background:#398bd6}.square:nth-child(3){background:#21a6a0}.square.wide{width:72px}.mini-title{color:#b9c8df;font-size:13px;margin-bottom:9px}.code{background:#0b1120;border:1px solid #344057;border-radius:12px;color:#d3eaf8;padding:17px 18px;font-size:clamp(15px,1.6vw,20px);line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.key{color:#c7acff}.value{color:#7de1c2}.wrong{color:#ff9d9d}.preview-head{height:160px;background:#253552;border-radius:12px;padding:20px;display:flex;justify-content:space-between;gap:12px;align-items:center}.logo{font-size:24px;font-weight:850}.navlinks{display:flex;gap:12px;align-items:center;font-size:14px}.navlinks li:last-child a{background:#8c70ee;padding:11px;border-radius:9px}.product{background:white;color:#1d2540;border-radius:12px;padding:16px;display:flex;align-items:center;gap:20px}.product-img{background:#e9dfff;border-radius:12px;display:grid;place-items:center;font-size:64px;width:142px;height:142px;flex:none}.product h3{font-size:21px;margin:0 0 5px}.product p{font-size:15px;margin:0 0 8px}.buy{background:#7551dc;border-radius:8px;padding:8px 15px;color:white;display:inline-block;font-size:14px}.notice{background:#e9fff7;color:#184d40;border-radius:12px;display:flex;align-items:center;gap:14px;padding:22px 18px;min-height:135px}.notice .notice-icon{font-style:normal;background:#52c89c;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;font-weight:900;font-size:24px;color:white;flex:none}.notice strong{display:block;font-size:20px}.notice small{display:block;font-size:15px}.column-demo{height:230px;background:#0e172a;border:2px dashed #51617f;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:15px}.column-demo .square{width:100px;height:45px}.challenge{background:#162a3b;border:1px solid #326279;padding:12px 15px;border-radius:11px;font-size:17px;line-height:1.5;margin-top:14px}.answerbox{margin-top:21px;background:#14352f;border:1px solid #438c78;border-radius:14px;padding:20px;display:none}.answerbox.open{display:block}.answerbox h3{margin:0 0 8px;color:#93f4d2}.answerbox p{margin:0;line-height:1.55;font-size:17px}.answerbox pre{white-space:pre-wrap;color:#caffec;font-size:17px;margin:12px 0 0}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}.btn{padding:13px 20px;border-radius:11px;border:1px solid #586783;background:#25304a;color:white;font-weight:750;font-size:16px}.btn.primary{background:linear-gradient(135deg,#7b5dea,#5c56d7);border-color:#9e8aff}.btn.reveal{background:#184e44;border-color:#449e83;color:#ddfff3}.btn:disabled{opacity:.35;cursor:not-allowed}.foot{display:flex;justify-content:space-between;gap:12px;color:#aab8d0;margin-top:16px;font-size:13px;flex-wrap:wrap}.kbd{border:1px solid #53627b;padding:2px 6px;border-radius:4px}.tiny{font-size:14px;color:var(--muted)}.html-caption{color:#b9c8df;font-size:13px;margin:12px 0 8px}.html-code{font-size:clamp(12px,1.3vw,16px);line-height:1.65;white-space:pre;overflow:auto;tab-size:2}.html-code .tag{color:#bba3ff}.html-code .attribute{color:#ffd18a}.html-code .string{color:#85e4ce}.html-code .comment{color:#91a2be}.flex-tree{padding:14px;background:#101b30;border:1px solid #43516c;border-radius:12px;margin-top:12px}.tree-item{border:1px solid #6b78a1;padding:10px;border-radius:9px;margin:7px 0;background:#253451;color:white}.tree-children{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tree-children>span{display:block;flex:1;min-width:76px;border:1px solid #5faeac;border-radius:7px;background:#164d52;padding:9px;text-align:center;font-size:13px}.tree-note{font-size:13px;color:#b8cce6;line-height:1.5}.two-col-preview{display:flex;gap:12px;align-items:center;background:#fafbff;color:#202a43;padding:13px;border-radius:12px}.two-col-preview .pic{width:95px;height:95px;flex:none;background:#efe8ff;border-radius:10px;display:grid;place-items:center;font-size:44px}.two-col-preview .description{display:flex;flex-direction:column;align-items:flex-start;gap:7px}.two-col-preview .description strong{font-size:19px}.two-col-preview .description small{color:#515f77}.two-col-preview .description b{color:#4d2ba6}.two-col-preview .description em{font-style:normal;background:#7551dc;border-radius:7px;color:white;padding:6px 12px}.preview-head a,.navlinks a{color:inherit;text-decoration:none}.navlinks ul{display:flex;align-items:center;gap:12px;list-style:none;padding:0;margin:0}.navlinks li{margin:0}.product-img{object-fit:contain}.product .info{display:flex;flex-direction:column;align-items:flex-start;gap:6px}.product .info p{margin:0}.buy{border:0;cursor:pointer}.preview-head .logo{color:inherit;text-decoration:none}.code-line{border-top:1px dashed #485b76;margin-top:12px;padding-top:12px}.tag-note{display:inline-block;border:1px solid #579d91;color:#9bffdf;border-radius:6px;padding:3px 7px;font-size:12px;margin-top:9px}@media(max-width:780px){.shell{padding:18px 15px 30px}.content{grid-template-columns:1fr}.card{min-height:0}.notebook{font-size:18px}.navlinks,.navlinks ul{gap:5px;font-size:11px}.logo{font-size:17px}.product-img{width:90px;height:110px;font-size:40px}.product{gap:11px}.product h3{font-size:18px}.btn{font-size:14px;padding:12px}}@media print{body{background:white;color:black}.shell{max-width:none}.top,.progress,.controls,.foot,.reveal{display:none!important}.card{break-inside:avoid;background:white;color:black;border:1px solid #aaa}.lead{color:#333!important}.content{grid-template-columns:1fr 1fr}.answerbox{display:none!important}}
</style></head>
<body><main class="shell" id="top"><header class="top"><a class="brand" href="#top" aria-label="Flexbox Lab — на початок">&lt;/&gt; FLEXBOX LAB <span style="color:#c5d1e9;font-weight:450">· спільний урок</span></a><div class="topright"><span class="pill" id="counter">01 / 15</span><button type="button" class="reset" onclick="go(0)">↺ На початок</button></div></header><div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div><section class="meta"><span class="stage" id="stage"></span><span class="minutes" id="time"></span><span class="minutes">✎ Відповіді записуємо в зошит</span></section><h1 id="title"></h1><p class="lead" id="lead"></p><section class="content"><article class="card"><h2>✎ Завдання у зошиті</h2><ol class="notebook" id="questions"></ol><div id="hint"></div></article><article class="card"><h2>◈ Дивись на екран</h2><div id="visual"></div></article></section><section class="answerbox" id="answerbox"><h3>✓ Перевіряємо разом</h3><div id="answer"></div></section><nav class="controls" aria-label="Керування завданнями"><button type="button" class="btn" onclick="move(-1)" id="prev">← Назад</button><button type="button" class="btn reveal" id="reveal" onclick="toggleAnswer()">👁 Показати відповідь</button><button type="button" class="btn primary" onclick="move(1)" id="next">Наступне завдання →</button></nav><footer class="foot"><span>Порада: спочатку обговоріть варіанти, потім відкрийте відповідь.</span><span>Керування: <span class="kbd">←</span> <span class="kbd">→</span> · <span class="kbd">Пробіл</span> — відповідь</span></footer></main>
<script>
const sq=(direction='row',justify='flex-start',align='flex-start',labels=['1','2','3'])=>`<div class="screen" style="flex-direction:${direction};justify-content:${justify};align-items:${align}">${labels.map(l=>`<div class="square">${l}</div>`).join('')}</div>`;
const code=(x)=>`<div class="code">${x}</div>`;
const htmlExample=(html)=>'<div class="html-caption">HTML — визнач батьківські та дочірні елементи</div><pre class="code html-code">'+html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</pre>';
const tree=(parent,children)=>'<div class="flex-tree"><div class="tree-item">БАТЬКІВСЬКИЙ: '+parent+'<div class="tree-children">'+children.map(x=>'<span>'+x+'</span>').join('')+'</div></div><div class="tree-note">Прямі дочірні елементи стають flex-елементами, якщо батькові задати display: flex.</div></div>';
const tasks=[
{stage:'01 · АКТИВАЦІЯ',time:'3 хв',title:'Пригадай: хто керує розташуванням?',lead:'Три елементи стоять в одному рядку і притиснуті до правого краю контейнера.',questions:['Яка властивість створює flex-контейнер?','Яке значення justify-content потрібне?','Запиши дві CSS-властивості.'],visual:sq('row','flex-end'),answer:'<pre>.container {\n  display: flex;\n  justify-content: flex-end;\n}</pre>'},
{stage:'02 · ПОВТОРЕННЯ',time:'4 хв',title:'Завдання «Розсунь блоки»',lead:'Перший блок має бути біля лівого краю, останній — біля правого, а третій простір поділиться між ними рівномірно.',questions:['Яке значення justify-content обереш?','Запиши один потрібний CSS-рядок.','Чим воно відрізняється від space-around?'],visual:sq('row','space-between'),answer:'<pre>justify-content: space-between;</pre><p>У space-between крайні елементи стоять біля країв, а проміжки між ними однакові. У space-around є простір також біля країв.</p>'},
{stage:'03 · ПОВТОРЕННЯ',time:'4 хв',title:'Завдання «Поверни вісь»',lead:'Тепер блоки стоять один під одним, а не в ряд. Вони розподілені за висотою контейнера.',questions:['Яка властивість змінює напрямок головної осі?','Запиши flex-direction та justify-content.','По якій осі тепер працює justify-content?'],visual:'<div class="column-demo"><div class="square">1</div><div class="square">2</div><div class="square">3</div></div>',answer:'<pre>display: flex;\nflex-direction: column;\njustify-content: space-between;</pre><p>Головна вісь тепер вертикальна, отже justify-content розподіляє елементи зверху вниз.</p>'},
{stage:'04 · ВІДКРИТТЯ НОВОГО',time:'5 хв',title:'Проблема: чому все зверху?',lead:'Ми зробили шапку сайту. Логотип і кнопка розташовані по краях, але вони біля верхнього краю. Хочемо вирівняти їх посередині за висотою.',questions:['Чи допоможе justify-content: center? Чому?','Якого вирівнювання нам бракує?','Як називається нова властивість?'],visual:"<div class=\"mini-title\">Поточний результат</div><div class=\"preview-head\" style=\"align-items:flex-start\"><a class=\"logo\" href=\"#top\">CodeSpace</a><nav class=\"navlinks\" aria-label=\"Приклад меню\"><ul><li><a href=\"#top\">Курси</a></li><li><a href=\"#top\">Увійти</a></li></ul></nav></div>"+code('.header {\n  display: flex;\n  justify-content: space-between;\n  height: 160px;\n}'),answer:'<pre>align-items: center;</pre><p><strong>align-items</strong> вирівнює flex-елементи по поперечній осі. Якщо flex-direction: row, поперечна вісь — вертикальна.</p>'},
{stage:'05 · НОВА ВЛАСТИВІСТЬ',time:'5 хв',title:'Досліди align-items',lead:'Уяви три кнопки в контейнері висотою 200 px. Нам потрібно змінювати їхню висоту розташування, а не відстань між ними.',questions:['Яке значення поставить елементи по центру висоти?','Яке притисне їх до нижнього краю?','Яке притисне до верхнього краю?'],visual:'<div class="mini-title">Приклад: елементи посередині по висоті</div>'+sq('row','space-around','center')+code('display: flex;\njustify-content: space-around;\nalign-items: center;'),answer:'<pre>center     — посередині\nflex-end   — внизу\nflex-start — вгорі</pre><p>Ці відповіді стосуються flex-direction: row. При column поперечна вісь горизонтальна.</p>'},
{stage:'06 · ПЕРЕВІР РОЗУМІННЯ',time:'5 хв',title:'Пастка: змінили flex-direction',lead:'Контейнер має flex-direction: column. Потрібно розмістити блоки посередині за шириною.',questions:['Що тепер робить justify-content?','Що тепер робить align-items?','Який CSS-рядок вирівняє блоки по центру ширини?'],visual:'<div class="column-demo" style="justify-content:center;gap:8px"><div class="square">1</div><div class="square">2</div><div class="square">3</div></div>',answer:'<pre>flex-direction: column;\nalign-items: center;</pre><p>При column головна вісь вертикальна, а поперечна — горизонтальна. Тому align-items: center центрує елементи по ширині.</p>'},
{stage:'07 · РЕАЛЬНА ВЕРСТКА',time:'5 хв',title:'Замовлення №1: повідомлення сайту',lead:'На сайті з’явилося повідомлення. Значок галочки і текст повинні стояти поруч, а значок — бути посередині текстового блоку.',questions:['Які дві CSS-властивості потрібні для .notice?','Яке значення align-items обереш?','Як зробити проміжок між іконкою і текстом? (Додатково)'],visual:"<div class=\"notice\" role=\"status\"><span class=\"notice-icon\" aria-hidden=\"true\">✓</span><div><strong>Дані збережено</strong><small>Тепер можна продовжити роботу.</small></div></div>",answer:'<pre>.notice {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n}</pre><p>gap задає проміжок між елементами. Якщо він ще не вивчений — його можна просто показати.</p>'},
{stage:'08 · РЕАЛЬНА ВЕРСТКА',time:'6 хв',title:'Замовлення №2: шапка сайту',lead:'Клієнт просить розмістити логотип зліва, меню і кнопку справа. Усі елементи мають бути посередині висоти шапки.',questions:["Який тег і атрибут використовуємо для клікабельного логотипа?", "Назви послідовність тегів для списку навігаційних посилань. Який обов’язковий атрибут має <a>?", "Які елементи стануть flex-елементами .header? А які — .nav-list?", "Запиши CSS для .header і .nav-list."],visual:"<header class=\"preview-head\"><a class=\"logo\" href=\"#top\">CodeSpace</a><nav class=\"navlinks\" aria-label=\"Приклад основної навігації\"><ul><li><a href=\"#top\">Курси</a></li><li><a href=\"#top\">Про нас</a></li><li><a href=\"#top\">Увійти</a></li></ul></nav></header>"+htmlExample("<header class=\"header\">\n  <a class=\"logo\" href=\"/\">CodeSpace</a>\n  <nav aria-label=\"Основна навігація\">\n    <ul class=\"nav-list\">\n      <li><a href=\"/courses\">Курси</a></li>\n      <li><a href=\"/about\">Про нас</a></li>\n      <li><a href=\"/login\">Увійти</a></li>\n    </ul>\n  </nav>\n</header>"),answer:"<pre>.header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}\n.nav-list {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  list-style: none;\n  margin: 0;\n  padding: 0;\n}</pre><p>Логотип — <code>&lt;a href=\"/\"&gt;</code>, оскільки веде на головну сторінку. Навігація — <code>nav &gt; ul &gt; li &gt; a[href]</code>. Безпосередні діти header — a.logo і nav; безпосередні діти ul.nav-list — елементи li.</p>"},
{stage:'09 · РЕАЛЬНА ВЕРСТКА',time:'7 хв',title:'Замовлення №3: картка товару',lead:'Фото має бути ліворуч, а інформація — праворуч. Текстовий блок центрується по висоті відносно фото. Назва, опис, ціна і кнопка йдуть зверху вниз.',questions:["Який HTML-елемент відповідає за зображення товару? Назви важливі атрибути.", "Чому «Купити» — це button, а не span?", "Які два елементи отримають display: flex?", "Запиши CSS для .product та .info."],visual:"<article class=\"product\"><div class=\"product-img\" role=\"img\" aria-label=\"Навушники\">🎧</div><div class=\"info\"><h3>Навушники</h3><p>Бездротові</p><p class=\"price\"><strong>1 499 грн</strong></p><button type=\"button\" class=\"buy\">Купити</button></div></article>"+htmlExample("<article class=\"product\">\n  <img class=\"photo\" src=\"headphones.jpg\"\n       alt=\"Фіолетові навушники\" width=\"140\" height=\"140\">\n  <div class=\"info\">\n    <h3>Навушники</h3>\n    <p>Бездротові</p>\n    <p class=\"price\">1 499 грн</p>\n    <button type=\"button\">Купити</button>\n  </div>\n</article>"),answer:"<pre>.product {\n  display: flex;\n  align-items: center;\n  gap: 20px;\n}\n.info {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 8px;\n}</pre><p>Зображення — <code>img</code> з атрибутами <code>src</code> та змістовним <code>alt</code>; <code>width</code> і <code>height</code> задають початкові розміри. «Купити» — <code>button type=\"button\"</code>, якщо дія виконується на сторінці. Якщо це перехід на іншу сторінку, потрібне посилання <code>a href</code>.</p>"},
{stage:'10 · HTML І FLEXBOX',time:'5 хв',title:'Хто батько? Хто дитина?',lead:'Перш ніж писати CSS, потрібно правильно прочитати HTML. Знайди елемент, який об’єднує логотип і меню.',questions:["Який елемент є батьківським для логотипа та nav?", "Назви ДВА прямі дочірні елементи header.", "Хто є безпосереднім дочірнім елементом nav? А хто — ul?", "Якому елементу додати display: flex, щоб пункти меню li стали в ряд?"],visual:htmlExample("<header class=\"header\">\n  <a class=\"logo\" href=\"/\">CodeSpace</a>\n  <nav aria-label=\"Основна навігація\">\n    <ul class=\"nav-list\">\n      <li><a href=\"/courses\">Курси</a></li>\n      <li><a href=\"/login\">Увійти</a></li>\n    </ul>\n  </nav>\n</header>")+tree('.header',['a.logo','nav']),answer:"<pre>.header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}\n.nav-list {\n  display: flex;\n  gap: 12px;\n}</pre><p>header має прямих дітей <code>a.logo</code> і <code>nav</code>. nav має одну пряму дитину — <code>ul.nav-list</code>. ul має дітей <code>li</code>, а вже всередині li розміщуються посилання a. Отже, flex-контейнером для пунктів меню має бути <code>ul</code>, а не nav.</p>"},
{stage:'11 · HTML І FLEXBOX',time:'5 хв',title:'Один контейнер чи два?',lead:'Клієнт хоче логотип ліворуч, а три посилання праворуч в одному рядку. Подивися на вкладені елементи і виріши, де потрібен Flexbox.',questions:["Знайди два flex-контейнери, які потрібні для цього макета.", "Що стане flex-елементами .header?", "Що стане flex-елементами .nav-list — li чи a?", "Запиши CSS для .header та .nav-list."],visual:htmlExample("<header class=\"header\">\n  <a class=\"logo\" href=\"/\">WebLab</a>\n  <nav aria-label=\"Основна навігація\">\n    <ul class=\"nav-list\">\n      <li><a href=\"/\">Головна</a></li>\n      <li><a href=\"/about\">Про нас</a></li>\n      <li><a href=\"/contacts\">Контакти</a></li>\n    </ul>\n  </nav>\n</header>")+"<div class=\"html-caption\">Потрібний результат</div><div class=\"preview-head\" style=\"height:95px\"><a class=\"logo\" style=\"font-size:19px\" href=\"#top\">WebLab</a><nav class=\"navlinks\" aria-label=\"Приклад меню\"><ul><li><a href=\"#top\">Головна</a></li><li><a href=\"#top\">Про нас</a></li><li><a href=\"#top\">Контакти</a></li></ul></nav></div>",answer:"<pre>.header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}\n.nav-list {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  list-style: none;\n  padding: 0;\n  margin: 0;\n}</pre><p>Два flex-контейнери: header розміщує a.logo та nav, а ul.nav-list розміщує своїх безпосередніх дітей li. Посилання a знаходяться всередині li і не стають flex-елементами ul.</p>"},
{stage:'12 · PRODUCT / HTML',time:'7 хв',title:'Картка товару: прочитай HTML',lead:'Перед тобою структура картки товару. Визнач, хто кому батько, і які блоки мають стояти поруч, а які — один під одним.',questions:["Які прямі дочірні елементи має article.product?", "Які атрибути зображення img потрібні і для чого?", "Який елемент одночасно буде flex-елементом та flex-контейнером?", "Запиши CSS для розташування фото та інформації поруч."],visual:htmlExample("<article class=\"product\">\n  <img class=\"photo\" src=\"headphones.jpg\"\n       alt=\"Фіолетові навушники\" width=\"140\" height=\"140\">\n  <div class=\"info\">\n    <h3>Навушники</h3>\n    <p>Бездротові</p>\n    <p class=\"price\">1 499 грн</p>\n    <button type=\"button\">Купити</button>\n  </div>\n</article>")+tree('.product',['img.photo','div.info']),answer:"<pre>.product {\n  display: flex;\n  align-items: center;\n  gap: 20px;\n}\n.info {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 8px;\n}</pre><p>Прямі діти article.product — <code>img.photo</code> і <code>div.info</code>. Після display: flex вони стають flex-елементами. div.info одночасно може бути flex-контейнером для h3, p.price, p та button. Атрибут alt описує зміст зображення, src указує шлях до файлу.</p>"},
{stage:'13 · PRODUCT / РЕЗУЛЬТАТ',time:'7 хв',title:'Зверстай картку за зразком',lead:'Тепер порівняй HTML із готовим результатом. Учні записують у зошит CSS для двох контейнерів. Кожне рішення треба пояснити.',questions:["Назви батьківський елемент для img.photo та div.info.", "Які два селектори потребують display: flex?", "Де потрібен flex-direction: column і чому?", "Що зміниться, якщо у .info написати align-items: center?"],visual:"<div class=\"html-caption\">Результат, який треба відтворити</div><div class=\"two-col-preview\"><div class=\"pic\" role=\"img\" aria-label=\"Навушники\">🎧</div><div class=\"description\"><strong>Навушники</strong><small>Бездротові</small><b>1 499 грн</b><button type=\"button\" class=\"buy\">Купити</button></div></div>"+htmlExample("<article class=\"product\">\n  <img class=\"photo\" src=\"headphones.jpg\"\n       alt=\"Фіолетові навушники\" width=\"140\" height=\"140\">\n  <div class=\"info\">\n    <h3>Навушники</h3>\n    <p>Бездротові</p>\n    <p class=\"price\">1 499 грн</p>\n    <button type=\"button\">Купити</button>\n  </div>\n</article>"),answer:"<pre>.product {\n  display: flex;\n  align-items: center;\n  gap: 20px;\n}\n.info {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 8px;\n}</pre><p>article.product вирівнює зображення й увесь інформаційний блок. div.info розташовує h3, p і button вертикально. Важливо: <code>align-items: center</code> у .info центрував би внутрішні елементи горизонтально.</p>"},
{stage:'14 · ЗНАЙДИ ПОМИЛКУ',time:'6 хв',title:'ШІ переплутав батька і дитину',lead:'ШІ написав CSS для картки товару. Але фото та інформація не стають поруч. Знайди логічну помилку і виправ її.',questions:["Якому елементу ШІ помилково задав display: flex?", "Чому img.photo не може керувати сусіднім div.info?", "Який батьківський елемент повинен стати flex-контейнером?", "Якої властивості бракує в CSS-правилі .info?"],visual:htmlExample("<article class=\"product\">\n  <img class=\"photo\" src=\"headphones.jpg\"\n       alt=\"Фіолетові навушники\" width=\"140\" height=\"140\">\n  <div class=\"info\">\n    <h3>Навушники</h3>\n    <p>Бездротові</p>\n    <p class=\"price\">1 499 грн</p>\n    <button type=\"button\">Купити</button>\n  </div>\n</article>")+code("/* Код ШІ — є помилка */\n.photo {\n  display: flex;\n  align-items: center;\n}\n.info {\n  flex-direction: column;\n}"),answer:"<pre>.product {\n  display: flex;\n  align-items: center;\n}\n.info {\n  display: flex;\n  flex-direction: column;\n}</pre><p>img.photo не є батьківським елементом для div.info. Лише їхній спільний батько article.product може розмістити їх поруч за допомогою Flexbox. До того ж правило flex-direction не діє на звичайний block-контейнер без display: flex.</p>"},
{stage:'15 · ФІНАЛЬНИЙ ЧЕЛЕНДЖ',time:'5 хв',title:'Ти — верстальник!',lead:'Подивись на готовий компонент і склади CSS-рішення самостійно. Використай усе, що вивчили: display, justify-content, flex-direction та align-items.',questions:["Які два теги a мають атрибут href? Чому використано саме посилання?", "Укажи прямих дітей .header і .status.", "Для яких двох елементів потрібен display: flex?", "Напиши CSS для вирівнювання .header і .status."],visual:"<div style=\"background:#253552;border-radius:12px;padding:16px;min-height:155px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><a href=\"#top\" style=\"font-size:21px;color:white;text-decoration:none;font-weight:700\">◈ DevSchool</a><a href=\"#top\" style=\"background:#8c70ee;border-radius:8px;padding:10px;color:white;text-decoration:none\">Профіль</a></div><div style=\"border-top:1px solid #63708d;margin:20px 0\"></div><div style=\"display:flex;justify-content:center;align-items:center;gap:10px\"><span style=\"color:#75e4c1;font-size:22px\" aria-hidden=\"true\">✓</span> Урок завершено!</div></div>"+htmlExample("<section class=\"dashboard\">\n  <header class=\"header\">\n    <a class=\"logo\" href=\"/\">DevSchool</a>\n    <a class=\"profile\" href=\"/profile\">Профіль</a>\n  </header>\n  <div class=\"status\" role=\"status\">\n    <span aria-hidden=\"true\">✓</span>\n    <span>Урок завершено!</span>\n  </div>\n</section>"),answer:"<pre>.header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}\n.status {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  gap: 10px;\n}</pre><p>Логотип і «Профіль» — навігаційні посилання з href, а статус — звичайне інформаційне повідомлення. flex-контейнери .header і .status керують власними безпосередніми дітьми.</p>"}
];
let current=0, revealed=false;
function go(n){current=Math.max(0,Math.min(tasks.length-1,n));revealed=false;render();}
function move(dx){go(current+dx)}
function toggleAnswer(){revealed=!revealed;document.getElementById('answerbox').classList.toggle('open',revealed);document.getElementById('reveal').textContent=revealed?'🙈 Приховати відповідь':'👁 Показати відповідь'}
function render(){let t=tasks[current];document.getElementById('counter').textContent=String(current+1).padStart(2,'0')+' / '+tasks.length;document.getElementById('bar').style.width=((current+1)/tasks.length*100)+'%';document.getElementById('stage').textContent=t.stage;document.getElementById('time').textContent='◷ '+t.time;document.getElementById('title').textContent=t.title;document.getElementById('lead').textContent=t.lead;document.getElementById('questions').innerHTML=t.questions.map(q=>'<li>'+q+'</li>').join('');document.getElementById('visual').innerHTML=t.visual;document.getElementById('answer').innerHTML=t.answer;document.getElementById('answerbox').classList.remove('open');document.getElementById('reveal').textContent='👁 Показати відповідь';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===tasks.length-1;window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.code==='Space'){e.preventDefault();toggleAnswer()}});render();
</script></body></html>
